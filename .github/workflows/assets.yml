name: Refresh profile panel

on:
  schedule:
    # 每天 03:17 UTC（避开整点，GitHub 的定时任务在整点最挤）
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_panel.py"
      - ".github/workflows/assets.yml"

permissions:
  contents: write

jobs:
  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate panel and link index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_panel.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/panel-light.svg assets/panel-dark.svg README.md
          if git diff --staged --quiet; then
            echo "panel unchanged; nothing to commit"
          else
            git commit -m "chore(profile): refresh panel data"
            git push
          fi
